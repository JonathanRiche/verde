name: Android Play internal

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to the Play internal track (off for the first, manual upload)
        type: boolean
        default: true
  push:
    tags:
      - "mobile-android-v*"

concurrency:
  group: mobile-android-play
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  internal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ZIG_VERSION: 0.16.0
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig-global
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Zig and the Android NDK
        run: |
          curl -fL --retry 5 --retry-delay 2 "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/zig-global
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('packages/client_core/build.zig', 'packages/client_core/build.zig.zon', 'packages/mobile_android/gradle/**', 'packages/mobile_android/**/*.gradle.kts') }}

      - name: Build release bundle
        working-directory: packages/mobile_android
        env:
          VERDE_VERSION_CODE: ${{ github.run_number }}
          VERDE_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          export VERDE_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$VERDE_UPLOAD_KEYSTORE"
          ./gradlew --no-daemon --console=plain bundleRelease
          rm -f "$VERDE_UPLOAD_KEYSTORE"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verde-android-${{ github.run_number }}
          path: packages/mobile_android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Play internal track
        if: github.event_name == 'push' || inputs.upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.verdeai.app
          releaseFiles: packages/mobile_android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
