name: iOS TestFlight
on:
  workflow_dispatch: {}
  push:
    tags: ['mobile-ios-v*']
permissions:
  contents: read
concurrency:
  group: mobile-ios-testflight
  cancel-in-progress: false
jobs:
  upload:
    # App Store Connect only accepts builds from Xcode 26+; the Mac mini stays on Xcode 16.2.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ZIG_VERSION: 0.16.0
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig-global
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select newest Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install Zig and XcodeGen
        run: |
          curl -fL --retry 5 --retry-delay 2 "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          brew install xcodegen

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/zig-global
          key: ios-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('packages/client_core/build.zig', 'packages/client_core/build.zig.zon') }}
          restore-keys: ios-zig-${{ env.ZIG_VERSION }}-

      - name: Build VerdeClient.xcframework
        working-directory: packages/client_core
        run: zig build ios-xcframework --release=safe

      - name: Install signing certificate and profiles
        env:
          DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          NSE_PROFILE_BASE64: ${{ secrets.IOS_NSE_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$APP_PROFILE_BASE64" | base64 --decode > "$dir/verde-app.mobileprovision"
            echo "$NSE_PROFILE_BASE64" | base64 --decode > "$dir/verde-nse.mobileprovision"
          done

      - name: Archive
        working-directory: packages/mobile_ios
        run: |
          xcodegen generate
          xcodebuild -project Verde.xcodeproj -scheme Verde -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Verde.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} archive

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>38GQPVTPNT</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.verdeai.app</key><string>Verde App Store</string>
              <key>dev.verdeai.app.NotificationServiceExtension</key><string>Verde NSE App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Verde.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm "$key"

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
