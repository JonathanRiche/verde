name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux:
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    container:
      image: node:24-trixie
    env:
      ZIG_VERSION: 0.16.0
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig-global

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/fff/target
          key: linux-x86_64-zig-${{ env.ZIG_VERSION }}-release-build-cache-${{ hashFiles('packages/desktop/build.zig.zon', 'packages/desktop/build.zig', 'build.zig', 'vendor/fff/Cargo.lock', 'vendor/fff/Cargo.toml', 'scripts/release/package-linux.sh') }}
          restore-keys: |
            linux-x86_64-zig-${{ env.ZIG_VERSION }}-release-build-cache-

      - name: Install Linux dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            g++ \
            git \
            libasound2-dev \
            libatk1.0-dev \
            libatspi2.0-dev \
            libcairo2-dev \
            libcups2-dev \
            libdbus-1-dev \
            libdrm-dev \
            libegl-dev \
            libfreetype-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles-dev \
            libglib2.0-dev \
            libharfbuzz-dev \
            libjavascriptcoregtk-6.0-dev \
            libnspr4-dev \
            libnss3-dev \
            libtree-sitter-dev \
            libwayland-dev \
            libwpebackend-fdo-1.0-dev \
            libwpewebkit-2.0-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libclang-dev \
            ninja-build \
            patchelf \
            pkg-config \
            python3 \
            xz-utils

      - name: Install Zig
        shell: bash
        run: |
          ZIG_VERSION="${ZIG_VERSION:-0.16.0}"
          ZIG_DOWNLOAD="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          ZIG_DIR="zig-x86_64-linux-${ZIG_VERSION}"
          curl -fL --retry 5 --retry-delay 2 "${ZIG_DOWNLOAD}" -o zig.tar.xz
          python3 -c "import tarfile; tarfile.open('zig.tar.xz').extractall('.')"
          echo "$PWD/${ZIG_DIR}" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          if ! command -v rustup >/dev/null 2>&1; then
            curl -fL --retry 5 --retry-delay 2 https://sh.rustup.rs -o rustup-init.sh
            sh rustup-init.sh -y --profile minimal --default-toolchain stable
          fi

          for attempt in 1 2 3; do
            if rustup toolchain install stable --profile minimal --no-self-update; then
              rustup default stable
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              cargo --version
              rustc --version
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            echo "Retrying Rust toolchain install after transient failure (attempt $attempt)"
            sleep 15
          done

      - name: Install Bun
        shell: bash
        run: |
          export BUN_INSTALL="${RUNNER_TEMP:-/tmp}/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"

          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
          fi

          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          bun --version

      - name: Install Node runtime dependencies
        shell: bash
        run: bun install --frozen-lockfile --production

      - name: Install SDL3 and SDL3_ttf
        shell: bash
        run: |
          SDL_VERSION=3.2.26
          curl -fL --retry 5 --retry-delay 2 \
            "https://www.libsdl.org/release/SDL3-${SDL_VERSION}.tar.gz" \
            -o SDL3.tar.gz
          tar -xf SDL3.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B SDL3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF
          cmake --build SDL3-build --parallel
          cmake --install SDL3-build
          ldconfig

          SDL_TTF_VERSION=3.2.2
          curl -fL --retry 5 --retry-delay 2 \
            "https://github.com/libsdl-org/SDL_ttf/releases/download/release-${SDL_TTF_VERSION}/SDL3_ttf-${SDL_TTF_VERSION}.tar.gz" \
            -o SDL3_ttf.tar.gz
          tar -xf SDL3_ttf.tar.gz
          cmake -S "SDL3_ttf-${SDL_TTF_VERSION}" -B SDL3_ttf-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDLTTF_VENDORED=OFF
          cmake --build SDL3_ttf-build --parallel
          cmake --install SDL3_ttf-build
          ldconfig

      - name: Compute release version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            release_version="${GITHUB_REF_NAME}"
          else
            fallback_sha="${GITHUB_SHA:-$(git rev-parse --short HEAD)}"
            fallback_run_number="${GITHUB_RUN_NUMBER:-local}"
            release_version="manual-${fallback_run_number}-${fallback_sha::7}"
          fi
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Build release artifact
        shell: bash
        run: |
          mkdir -p dist
          for attempt in 1 2 3; do
            if bash scripts/release/package-linux.sh "${RELEASE_VERSION:?missing release version}" dist; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            echo "Retrying release build after transient failure (attempt $attempt)"
            sleep 15
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-x86_64
          path: dist/*

  build-macos:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target:
          - macos-arm64
          - macos-x86_64

    runs-on: ${{ matrix.target == 'macos-x86_64' && 'macos-15-intel' || 'macos-14' }}
    env:
      ZIG_VERSION: 0.16.0
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig-global

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/fff/target
          key: ${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-release-build-cache-${{ hashFiles('packages/desktop/build.zig.zon', 'packages/desktop/build.zig', 'build.zig', 'vendor/fff/Cargo.lock', 'vendor/fff/Cargo.toml', 'scripts/release/package-linux.sh', 'scripts/release/package-macos-app.sh', 'scripts/release/fixup-macos-app.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-${{ env.ZIG_VERSION }}-release-build-cache-

      - name: Install Zig
        shell: bash
        run: |
          ZIG_VERSION="${ZIG_VERSION:-0.16.0}"
          case "${{ matrix.target }}" in
            macos-x86_64)
              ZIG_DOWNLOAD="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-macos-${ZIG_VERSION}.tar.xz"
              ZIG_DIR="zig-x86_64-macos-${ZIG_VERSION}"
              ;;
            macos-arm64)
              ZIG_DOWNLOAD="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
              ZIG_DIR="zig-aarch64-macos-${ZIG_VERSION}"
              ;;
            *)
              echo "unsupported release target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          curl -fL --retry 5 --retry-delay 2 "${ZIG_DOWNLOAD}" -o zig.tar.xz
          python3 -c "import tarfile; tarfile.open('zig.tar.xz').extractall('.')"
          echo "$PWD/${ZIG_DIR}" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"

          if ! command -v rustup >/dev/null 2>&1; then
            curl -fL --retry 5 --retry-delay 2 https://sh.rustup.rs -o rustup-init.sh
            sh rustup-init.sh -y --profile minimal --default-toolchain stable
          fi

          for attempt in 1 2 3; do
            if rustup toolchain install stable --profile minimal --no-self-update; then
              rustup default stable
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              cargo --version
              rustc --version
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            echo "Retrying Rust toolchain install after transient failure (attempt $attempt)"
            sleep 15
          done

      - name: Install Bun
        shell: bash
        run: |
          export BUN_INSTALL="${RUNNER_TEMP:-/tmp}/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"

          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
          fi

          echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
          bun --version

      - name: Install Node runtime dependencies
        shell: bash
        run: bun install --frozen-lockfile --production

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew install tree-sitter sdl3_ttf
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Compute release version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            release_version="${GITHUB_REF_NAME}"
          else
            fallback_sha="${GITHUB_SHA:-$(git rev-parse --short HEAD)}"
            fallback_run_number="${GITHUB_RUN_NUMBER:-local}"
            release_version="manual-${fallback_run_number}-${fallback_sha::7}"
          fi
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"

      - name: Build release artifact
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            macos-x86_64|macos-arm64)
              PACKAGE_SCRIPT="scripts/release/package-macos-app.sh"
              ;;
            *)
              echo "unsupported release target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          mkdir -p dist
          for attempt in 1 2 3; do
            if bash "${PACKAGE_SCRIPT}" "${RELEASE_VERSION:?missing release version}" dist; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            echo "Retrying release build after transient failure (attempt $attempt)"
            sleep 15
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  build-windows:
    name: Windows x86-64
    timeout-minutes: 180
    runs-on: windows-2022
    env:
      ZIG_VERSION: 0.16.0
      RUST_VERSION: 1.95.0
      BUN_VERSION: 1.3.14
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}\.cache\zig-global

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install pinned Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal --target x86_64-pc-windows-msvc
          rustup default $env:RUST_VERSION
          cargo --version
          rustc --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/zig-global
            .zig-cache/windows-deps
            vendor/fff/target
          key: windows-release-${{ github.event_name }}-${{ github.sha }}-x64-${{ env.ZIG_VERSION }}-${{ env.RUST_VERSION }}-${{ hashFiles('bun.lock', 'package.json', 'scripts/windows-dependencies.json', 'scripts/dev/bootstrap_windows_deps.py', 'scripts/dev/bootstrap-windows-deps.ps1', 'scripts/dev/build-windows.ps1', 'scripts/dev/verify-windows-package.ps1', 'scripts/release/package-windows.ps1', 'scripts/release/package-windows.py', 'scripts/release/sign-windows.ps1', 'packages/desktop/build.zig', 'packages/desktop/build.zig.zon', 'packages/ghostty/build.zig', 'packages/ghostty/build.zig.zon', 'build.zig', 'vendor/fff/Cargo.lock', 'vendor/fff/Cargo.toml') }}

      - name: Install JavaScript dependencies
        shell: pwsh
        run: bun install --frozen-lockfile --production

      - name: Test Windows packaging and launcher contracts
        shell: pwsh
        run: |
          node --test scripts/release/package-npm.test.mjs scripts/release/windows-npm-integrity.test.mjs packages/npm/verde/test/windows-launcher.test.js
          python -m unittest scripts.release.test_package_windows_integrity scripts.release.test_package_windows_version

      - name: Compute release version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -like "v*") {
            $Version = $env:GITHUB_REF_NAME
          } else {
            $Sha = if ([string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) {
              (git rev-parse --short HEAD).Trim()
            } else {
              $env:GITHUB_SHA
            }
            $RunNumber = if ([string]::IsNullOrWhiteSpace($env:GITHUB_RUN_NUMBER)) { "local" } else { $env:GITHUB_RUN_NUMBER }
            $ShortSha = $Sha.Substring(0, [Math]::Min(7, $Sha.Length))
            $Version = "manual-$RunNumber-$ShortSha"
          }
          if ([string]::IsNullOrWhiteSpace($Version)) { throw "Failed to compute a release version." }
          "RELEASE_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile native Windows tests
        shell: pwsh
        run: .\scripts\dev\build-windows.ps1 -CompileTests

      - name: Build and verify unsigned Windows package
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\scripts\release\package-windows.ps1 -Version "$env:RELEASE_VERSION" -OutputDir dist

      - name: Build, optionally sign, and verify Windows package
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: pwsh
        env:
          VERDE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          VERDE_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $HasCertificate = -not [string]::IsNullOrWhiteSpace($env:VERDE_SIGNING_PFX_BASE64)
          $HasPassword = -not [string]::IsNullOrWhiteSpace($env:VERDE_SIGNING_PFX_PASSWORD)
          if ($HasCertificate -xor $HasPassword) {
            throw "Configure both Windows signing secrets together, or leave both unset for an unsigned release."
          }

          if (-not $HasCertificate) {
            Write-Host "No Windows signing certificate configured; publishing an explicitly unsigned package."
            .\scripts\release\package-windows.ps1 -Version "$env:RELEASE_VERSION" -OutputDir dist
          } else {
            $CertificatePath = Join-Path $env:RUNNER_TEMP "verde-release-signing.pfx"
            try {
              [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:VERDE_SIGNING_PFX_BASE64))
              .\scripts\release\package-windows.ps1 `
                -Version "$env:RELEASE_VERSION" `
                -OutputDir dist `
                -CertificatePath $CertificatePath `
                -CertificatePassword $env:VERDE_SIGNING_PFX_PASSWORD `
                -RequireSignature
            } finally {
              Remove-Item -LiteralPath $CertificatePath -Force -ErrorAction SilentlyContinue
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-x86_64
          if-no-files-found: error
          path: dist/*

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true

  sync-aur:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: publish
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AUR SSH key
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY secret is required" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

      - name: Clone AUR repository
        shell: bash
        run: |
          git clone ssh://aur@aur.archlinux.org/verde-bin.git /tmp/verde-bin-aur

      - name: Update AUR package metadata
        shell: bash
        run: |
          bash ./scripts/release/update-aur-verde-bin.sh "${GITHUB_REF_NAME}" /tmp/verde-bin-aur

      - name: Commit and push AUR update
        shell: bash
        run: |
          cd /tmp/verde-bin-aur
          if git diff --quiet; then
            echo "No AUR changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update verde-bin to ${GITHUB_REF_NAME}"
          git push origin master
