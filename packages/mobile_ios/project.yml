name: Verde
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.verdeai.app
        PRODUCT_MODULE_NAME: VerdeApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # TestFlight/App Store signing; profiles are installed by .github/workflows/mobile-ios.yml.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 38GQPVTPNT
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Verde App Store
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Verde
        UIAppFonts: [cal_sans.ttf, jetbrains_mono.ttf, noto_sans_bold.ttf, noto_sans_regular.ttf]
        NSFaceIDUsageDescription: Unlock Verde to access your chats and paired hosts.
        NSCameraUsageDescription: Scan a Verde pairing QR code or attach a photo to a chat.
        CFBundleURLTypes:
          - CFBundleURLName: dev.verdeai.app.pair
            CFBundleURLSchemes: [verde]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking requires all four orientations or App Store validation fails.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: ../client_core/zig-out/lib/VerdeClient.xcframework
        embed: false
      - target: NotificationServiceExtension
  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources: [NotificationServiceExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.verdeai.app.NotificationServiceExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: 38GQPVTPNT
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Verde NSE App Store
    info:
      path: Generated/NotificationServiceExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # Recorded core fixtures shared with the Android tests (d06/d07/d09), never copied.
      - path: ../mobile_android/app/src/test/resources/fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.verdeai.app.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: App
schemes:
  Verde:
    build:
      targets:
        App: all
        Tests: [test]
    test:
      targets: [Tests]
      gatherCoverageData: false
