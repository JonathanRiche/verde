name: Verde
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  App:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.verdeai.app
        PRODUCT_MODULE_NAME: VerdeApp
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Verde
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: ../client_core/zig-out/lib/VerdeClient.xcframework
        embed: false
      - target: NotificationServiceExtension
  NotificationServiceExtension:
    type: app-extension
    platform: iOS
    sources: [NotificationServiceExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.verdeai.app.NotificationServiceExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/NotificationServiceExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.verdeai.app.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: App
schemes:
  Verde:
    build:
      targets:
        App: all
        Tests: [test]
    test:
      targets: [Tests]
      gatherCoverageData: false
